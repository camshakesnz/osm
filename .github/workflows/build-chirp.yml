# Builds Open Sound Meter (with chirp measurement) for Windows and macOS.
# Push to your fork or run it from the Actions tab, then download the
# artifacts from the finished run.
name: build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream version tags
        shell: bash
        run: git fetch --tags https://github.com/psmokotnin/osm.git || true
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'win64_msvc2019_64'
      - uses: ilammy/msvc-dev-cmd@v1
      # OSM builds ASIO support only when the Steinberg ASIO SDK sits next to the
      # source as ../asiosdk (with common/, host/, host/pc/). Without it the build
      # quietly falls back to WASAPI only.
      - name: Fetch Steinberg ASIO SDK
        shell: bash
        run: |
          curl -sSL --retry 3 -o "$RUNNER_TEMP/asiosdk.zip" https://www.steinberg.net/asiosdk
          mkdir -p "$RUNNER_TEMP/asiosdk-unzip"
          unzip -q "$RUNNER_TEMP/asiosdk.zip" -d "$RUNNER_TEMP/asiosdk-unzip"
          root=$(dirname "$(find "$RUNNER_TEMP/asiosdk-unzip" -path '*/common/asio.cpp' | head -1)")
          root=$(dirname "$root")
          echo "ASIO SDK found at: $root"
          test -f "$root/host/pc/asiolist.cpp"
          rm -rf ../asiosdk
          cp -r "$root" ../asiosdk
          # asiolist.cpp is written against the ANSI Win32 API (RegOpenKey,
          # CharLowerBuff with char*); Qt builds define UNICODE, so compile that
          # one file without it
          printf '#undef UNICODE\n#undef _UNICODE\n' | cat - ../asiosdk/host/pc/asiolist.cpp > asiolist.tmp
          mv asiolist.tmp ../asiosdk/host/pc/asiolist.cpp
          head -3 ../asiosdk/host/pc/asiolist.cpp
          ls ../asiosdk
      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\OpenSoundMeter.pro CONFIG+=release CONFIG+=no_pvs_studio > qmake.log 2>&1
          type qmake.log
          findstr /C:"Add ASIO driver Support" qmake.log || (echo ASIO SDK was not picked up & exit /b 1)
          nmake
      - name: Show Makefile on failure
        if: failure()
        shell: bash
        run: |
          for f in build/Makefile build/Makefile.Release; do
            echo "=== $f"; [ -f "$f" ] && sed -n '960,990p' "$f" | cat -A | cut -c1-300
          done
          grep -n "asiosdk" build/Makefile.Release | head -40 || true
      - name: Bundle Qt
        shell: cmd
        run: windeployqt --release --compiler-runtime --qmldir qml build\release\OpenSoundMeter.exe
      - name: Remove build objects
        shell: bash
        run: rm -f build/release/*.obj build/release/*.cpp build/release/*.h
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSoundMeter-chirp-windows
          path: build/release

  macos:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream version tags
        shell: bash
        run: git fetch --tags https://github.com/psmokotnin/osm.git || true
      - uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          arch: 'clang_64'
      - name: Build
        run: |
          mkdir build && cd build
          # Qt 5.15.2 for macOS is x86_64 only: build Intel, runs on Apple Silicon via Rosetta
          qmake ../OpenSoundMeter.pro CONFIG+=release QMAKE_APPLE_DEVICE_ARCHS=x86_64
          make -j3
      - name: Bundle Qt
        run: |
          cd build
          macdeployqt OpenSoundMeter.app -qmldir=../qml
          codesign --force --deep --sign - OpenSoundMeter.app
          hdiutil create -volname OpenSoundMeter -srcfolder OpenSoundMeter.app -ov -format UDZO OpenSoundMeter.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSoundMeter-chirp-macos
          path: build/OpenSoundMeter.dmg

  # Native Apple Silicon build (no Rosetta): Homebrew's Qt 5 is built for arm64
  macos-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch upstream version tags
        shell: bash
        run: git fetch --tags https://github.com/psmokotnin/osm.git || true
      - name: Install Qt 5 (Homebrew, arm64)
        run: |
          brew install qt@5
          echo "$(brew --prefix qt@5)/bin" >> $GITHUB_PATH
      - name: Build
        run: |
          qmake -v
          mkdir build && cd build
          # Metal charts (like the official Mac release); OpenGL on macOS is emulated and slow
          GRAPH_BACKEND=METAL qmake ../OpenSoundMeter.pro CONFIG+=release QMAKE_APPLE_DEVICE_ARCHS=arm64
          make -j3 2>&1 | tee build.log | grep -E "error|warning: unused" || true
          test -f OpenSoundMeter.app/Contents/MacOS/OpenSoundMeter || (tail -60 build.log; exit 1)
          grep -c "GRAPH_METAL" build.log
          file OpenSoundMeter.app/Contents/MacOS/OpenSoundMeter
          otool -l OpenSoundMeter.app/Contents/MacOS/OpenSoundMeter | grep -A3 LC_BUILD_VERSION | head -4
      - name: Bundle Qt
        run: |
          cd build
          macdeployqt OpenSoundMeter.app -qmldir=../qml
          # Apple Silicon only runs signed code: macdeployqt edits the binaries, so re-sign
          # (ad hoc: no Apple account needed; first launch is right-click → Open)
          codesign --force --deep --sign - OpenSoundMeter.app
          codesign --verify --deep --strict OpenSoundMeter.app && echo "signature ok"
      - name: Inspect bundle
        run: |
          cd build/OpenSoundMeter.app/Contents
          echo "--- qt.conf"; cat Resources/qt.conf || true
          echo "--- plugins"; ls -R PlugIns | head -60
          echo "--- cocoa plugin links"; otool -L PlugIns/platforms/libqcocoa.dylib || true
          echo "--- links still pointing at Homebrew"
          find . -type f \( -name "*.dylib" -o -perm +111 \) -exec sh -c 'otool -L "$1" 2>/dev/null | grep -q /opt/homebrew && echo "$1"' _ {} \; | head -20
      - name: Smoke test (launch for 15 s)
        run: |
          cd build
          QT_DEBUG_PLUGINS=1 ./OpenSoundMeter.app/Contents/MacOS/OpenSoundMeter > smoke.log 2>&1 &
          PID=$!
          sleep 15
          if kill -0 $PID 2>/dev/null; then echo "still running: OK"; kill $PID; else echo "EXITED EARLY"; tail -80 smoke.log; exit 1; fi
          grep -iE "cocoa|platform plugin|fatal" smoke.log | head -20 || true
      - name: Make dmg
        run: |
          cd build
          hdiutil create -volname OpenSoundMeter -srcfolder OpenSoundMeter.app -ov -format UDZO OpenSoundMeter-AppleSilicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSoundMeter-chirp-macos-apple-silicon
          path: build/OpenSoundMeter-AppleSilicon.dmg

